services:

  postgres:

    image: postgres:17

    container_name: bahguta-postgres

    hostname: postgres

    restart: unless-stopped

    env_file:
      - ../config/postgres/.env

    volumes:
      - ../data/postgres:/var/lib/postgresql/data

    networks:
      - bahguta

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bahguta -d bahguta"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bahguta:
    external: true
