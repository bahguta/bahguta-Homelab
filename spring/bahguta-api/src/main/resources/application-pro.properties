spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Bahguta

bahguta.heartbeat-seconds=60
bahguta.mqtt.host=192.168.1.10
bahguta.mqtt.port=1883
bahguta.mqtt.topic=bahguta

bahguta.scripts.path=/opt/bahguta/scripts/
bahguta.scripts.docker.list=docker/list.sh
bahguta.scripts.docker.start=docker/start.sh
bahguta.scripts.docker.stop=docker/stop.sh
