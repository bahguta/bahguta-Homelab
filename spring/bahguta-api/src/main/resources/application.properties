spring.application.name=bahguta-api

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info

# Swagger
springdoc.swagger-ui.path=/swagger


# OpenWeather
bahguta.weather.api-key=${WEATHER_API_KEY}
bahguta.weather.city=${WEATHER_CITY}
bahguta.weather.country=${WEATHER_COUNTRY}

# Prometheus
bahguta.prometheus.url=${PROMETHEUS_URL}

# Omada
bahguta.omada.url=${OMADA_URL}
bahguta.omada.username=${OMADA_USERNAME}
bahguta.omada.password=${OMADA_API_PASSWORD}
bahguta.omada.site=${OMADA_SITE}
bahguta.omada.insecure-tls=${OMADA_INSECURE_TLS}